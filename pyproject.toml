[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testy-mcp"
version = "1.0.0"
description = "MCP (Model Context Protocol) server plugin for TestY TMS"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "django-oauth-toolkit>=2.0",
    "uvicorn<0.36",
]

[project.entry-points.testy]
testy-mcp = "testy_mcp"

[tool.setuptools.packages.find]
include = ["testy_mcp*"]
