default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Preserve the generated stylesheet copied from the TestY frontend.
        exclude: ^testy_mcp/static/testy_mcp/uikit\.css$
      - id: check-yaml
      - id: check-added-large-files
        # These bundled frontend assets intentionally exceed the size limit.
        exclude: ^testy_mcp/static/testy_mcp/(Inter-VariableFont\.ttf|uikit\.css)$

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
